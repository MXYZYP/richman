# 小程序端构建冒烟（P2）：同步源站 → 非法标签门禁 → mp-weixin 构建 → 产物结构核验。
# 之前 weapp 只在本地手工跑，src/game 同步失败 / patches.mjs 失配 / 类型债都不会被 CI 拦。
# 注意：必须走 pnpm 全 workspace 安装——weapp 的类型解析依赖根 node_modules
# （@types/node / vitest / qrcode 等），只对子目录 npm ci 会全部断链（首跑失败教训）。
name: weapp-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/client/src/**'
      - 'apps/weapp/**'
      # weapp 的 tsconfig include 了这三个包的 src（类型检查会读它们），
      # 改协议/引擎/地图数据同样能让小程序端构建炸，必须一并触发。
      - 'packages/protocol/src/**'
      - 'packages/engine/src/**'
      - 'packages/board-data/src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @richman/weapp run typecheck

      - name: Build mp-weixin
        run: pnpm --filter @richman/weapp run build:mp

      - name: Verify build output structure
        run: |
          out=apps/weapp/dist/build/mp-weixin
          if [ ! -f "$out/app.json" ]; then
            echo "::error::$out/app.json missing"
            exit 1
          fi
          count=$(find "$out" -type f | wc -l)
          echo "output files: $count"
          if [ "$count" -lt 100 ]; then
            echo "::error::unexpectedly few output files ($count), build likely incomplete"
            exit 1
          fi
          # 只拦真正致命的标签；<svg> 是已知既有状态（MapThumbnail 静默渲染为空），
          # 非法标签的权威门禁是 build:mp 里的 scan-tags，这里不重复更严的口径。
          if grep -rEl '<(dialog|select)\b' "$out" --include='*.wxml'; then
            echo "::error::forbidden tags (dialog/select) found in wxml output"
            exit 1
          fi
