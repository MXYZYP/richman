# 推送到 main 后，自动 SSH 到服务器执行部署（对齐远端 -> 构建前端 -> 服务端类型检查 -> pm2 重启）。
#
# 使用前需在 仓库 Settings → Secrets and variables → Actions 添加三个 Secret：
#   SERVER_HOST     服务器 IP 或域名（不含用户名），例如 101.200.189.252
#   SERVER_USER     登录用户，例如 root
#   SERVER_SSH_KEY  部署用 SSH 私钥（整段，含 -----BEGIN/END----- 行）
#
# 前提：服务器已把对应公钥加入 authorized_keys，且 /root/richman-main 已是 git 检出
#       （若仓库为 Private，服务器还需能拉取：用只读 Deploy Key，或把仓库设为 Public）。
name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 2026-10-28：服务器 sshd 出现过「banner exchange 超时」的长窗口（本机与 runner 侧
    # 双双连不上，持续 1h+）。appleboy/ssh-action 的 command_timeout 只管「命令执行」，
    # 管不到「连接期」——连接挂死时 job 会一直挂到默认 6h，还占着 concurrency 把后续
    # 部署全挡住。这里给 job 层兜底：挂到 25m 直接判失败并告警（command_timeout 20m
    # 是正常构建的上限，多给 5m 余量）。
    timeout-minutes: 25
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          # 2026-10-26：前端构建（vue-tsc + vite build）在这台服务器上耗时波动极大
          # （实测 50s ~ 8min+），10m 曾在构建步骤被掐断（Run Command Timeout），
          # 整次部署中止、pm2 未重启。提到 20m 留足余量。
          command_timeout: 20m
          script: |
            cd /root/richman-main
            # 必须先在本步内把仓库对齐到 origin/main，再跑 deploy.sh：
            # deploy.sh 自身也会 fetch+reset —— 若不对齐，脚本执行中会把自己的文件
            # 换成新版，bash 按字节偏移继续读、新旧内容混跑（曾在日志里看到
            # [1/4] 与 [3/4] 混着新版 5 步结构）。先对齐后，reset 变成 no-op，不再自改写。
            git fetch origin main
            git reset --hard origin/main
            bash deploy.sh
