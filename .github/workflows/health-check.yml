# 线上探活（P1）：每小时核验 /healthz 200 + 线上 sw.js 版本与仓库一致。
# sw 版本比对能同时抓住「部署没跑新代码」和「忘升 SW 缓存版本」两类事故。
name: health-check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Extract expected SW version from repo
        id: sw
        run: |
          expected=$(grep -o 'richman-v[0-9]*' apps/client/public/sw.js | head -1)
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "expected SW: $expected"

      - name: Probe /healthz
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 https://game.mxyzyp.xyz/healthz)
          echo "healthz status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::/healthz returned $code (expected 200)"
            exit 1
          fi

      - name: Verify online SW version matches repo
        run: |
          online=$(curl -s --max-time 45 https://game.mxyzyp.xyz/sw.js | grep -o 'richman-v[0-9]*' | head -1)
          echo "online SW: $online"
          if [ "$online" != "${{ steps.sw.outputs.expected }}" ]; then
            echo "::error::SW version drift: online=$online expected=${{ steps.sw.outputs.expected }}（线上没跑上新前端，或仓库忘了升 SW 版本）"
            exit 1
          fi
