# 线上探活（P1）：每小时核验服务器侧 /healthz 200、pm2 richman 在线、
# 线上 sw.js 版本与仓库一致。探针本体在 .github/scripts/server-health-probe.sh。
#
# ★ 为什么走 SSH：GitHub 海外 runner 到这台国内服务器（101.200.189.252）的
#   公网 HTTP 整体不通（15s/45s 双双 curl exit 28，2026-10-28 实测）。
# ★ 为什么普通 ssh + 3 次重试而不是 appleboy/ssh-action 单发：服务器 sshd
#   存在「banner exchange 超时」的间歇抖动（本机与 runner 侧都实测过），单发
#   连接会话挂死直到 job 超时；重试能跨过抖动窗口。
# ★ 期望版本从 runner 侧 checkout 提取（源头是 GitHub 仓库），不从服务器仓库取
#   —— 否则「部署没对齐仓库」时两边一起旧、比对永远通过。
name: health-check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Extract expected SW version from repo
        id: sw
        run: |
          expected=$(grep -o 'richman-v[0-9]*' apps/client/public/sw.js | head -1)
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "expected SW: $expected"

      - name: Probe server over SSH (3 attempts)
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          EXPECTED_SW: ${{ steps.sw.outputs.expected }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/probe_key
          chmod 600 ~/.ssh/probe_key
          ok=0
          for i in 1 2 3; do
            echo "--- attempt $i ---"
            if ssh -i ~/.ssh/probe_key \
                 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
                 "$SSH_USER@$SSH_HOST" "EXPECT='$EXPECTED_SW' bash -s" \
                 < .github/scripts/server-health-probe.sh; then
              ok=1
              break
            fi
            echo "attempt $i failed, retrying in 30s"
            sleep 30
          done
          if [ "$ok" != "1" ]; then
            echo "::error::health probe failed after 3 attempts（SSH 连接或探针失败）"
            exit 1
          fi
