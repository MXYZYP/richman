name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Resolve last successful deployment revision
        id: release-revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          previous_sha="$(
            gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/runs" \
              -f status=success \
              -f branch=main \
              -f per_page=1 \
              --jq '.workflow_runs[0].head_sha // ""'
          )"
          if [[ -z "$previous_sha" ]] || ! git merge-base --is-ancestor "$previous_sha" HEAD; then
            previous_sha="$PUSH_PREVIOUS_SHA"
            if [[ -z "$previous_sha" ]] || [[ "$previous_sha" == "0000000000000000000000000000000000000000" ]]; then
              previous_sha="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            fi
          fi
          printf 'sha=%s\n' "$previous_sha" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        run: pnpm release:check
        env:
          RELEASE_PREVIOUS_SHA: ${{ steps.release-revision.outputs.sha }}


      - name: Build client (also required by server tests serving client/dist)
        run: pnpm --filter @richman/client build

      - name: Test (gate before deploy)
        run: pnpm test

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@4.114.0 pages deploy apps/client/dist --project-name=richman --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
